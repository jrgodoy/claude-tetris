<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1 class="title">TETRIS</h1>

  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>

        <div class="panel-section">
          <span class="label">TEMA</span>
          <button id="theme-toggle" class="theme-toggle" role="switch" aria-checked="false">
            <span class="track"><span class="thumb"></span></span>
            <span id="theme-label">Oscuro</span>
          </button>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <form id="name-form" class="name-form hidden" autocomplete="off">
          <label for="name-input">¡Entras en el top 5! Tu nombre:</label>
          <div class="name-row">
            <input id="name-input" type="text" maxlength="12" placeholder="Nombre" />
            <button type="submit" id="save-btn" class="btn">Guardar</button>
          </div>
        </form>
        <div id="gameover-records" class="records-box hidden">
          <div class="records" id="records-over"></div>
          <button type="button" class="btn-link reset-records">Borrar récords</button>
        </div>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <div id="start-screen" class="overlay">
      <div class="overlay-box">
        <p class="start-title">RÉCORDS</p>
        <div class="records" id="records-start"></div>
        <button type="button" class="btn-link reset-records">Borrar récords</button>
        <button id="play-btn">Jugar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
